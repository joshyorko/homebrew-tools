name: Tap Auto Update

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "17 0,6,12,18 * * *"
    - cron: "17 2,4,8,10,14,16,20,22 * * *"
    - cron: "41 6 * * *"
    # `t3-code-6h` relies on the separate 06:41 `t3-daily` run plus the times below to keep an effective 6-hour cadence.
    - cron: "41 0,12,18 * * *"
  workflow_dispatch:
    inputs:
      slot_id:
        description: "Named auto-update slot from dagger/tap-pipeline"
        required: true
        type: choice
        options:
          - rcc-daily
          - action-server-daily
          - desktop-6h
          - vscode-insiders-2h
          - t3-daily
          - t3-code-6h

permissions:
  contents: write

env:
  DAGGER_VERSION: "0.20.3"
  GH_TOKEN: ${{ github.token }}

jobs:
  resolve:
    name: Resolve Auto Update Slot
    runs-on: ubuntu-latest
    outputs:
      slot_id: ${{ steps.slot.outputs.slot_id }}
      trigger_source: ${{ steps.slot.outputs.trigger_source }}
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve auto-update slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT_ID: ${{ inputs.slot_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            slot_id="$INPUT_SLOT_ID"
            trigger_source="workflow_dispatch"
          else
            case "$EVENT_SCHEDULE" in
              "0 6 * * *") slot_id="rcc-daily" ;;
              "0 7 * * *") slot_id="action-server-daily" ;;
              "17 0,6,12,18 * * *") slot_id="desktop-6h" ;;
              "17 2,4,8,10,14,16,20,22 * * *") slot_id="vscode-insiders-2h" ;;
              "41 6 * * *") slot_id="t3-daily" ;;
              "41 0,12,18 * * *") slot_id="t3-code-6h" ;;
              *)
                echo "Unknown scheduled slot for Tap Auto Update: $EVENT_SCHEDULE" >&2
                exit 1
                ;;
            esac
            trigger_source="schedule:$EVENT_SCHEDULE"
          fi

          echo "slot_id=$slot_id" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$trigger_source" >> "$GITHUB_OUTPUT"

      - name: Resolve slot packages through Dagger
        id: dagger_slot
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: ./dagger/tap-pipeline
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: "true"
          call: >-
            packages-for-auto-update-slot
            --slot-id="${{ steps.slot.outputs.slot_id }}"

      - name: Build matrix from slot output
        id: packages
        env:
          SLOT_ID: ${{ steps.slot.outputs.slot_id }}
          TRIGGER_SOURCE: ${{ steps.slot.outputs.trigger_source }}
        run: |
          set -euo pipefail
          packages_json='${{ steps.dagger_slot.outputs.output }}'
          matrix="$(jq -cn --argjson packages "$packages_json" '{include: ($packages | map({package_id: .id}))}')"
          count="$(jq '.include | length' <<<"$matrix")"
          package_ids="$(jq -r 'map(.id) | join(", ")' <<<"$packages_json")"

          if [ "$count" -eq 0 ]; then
            echo "Auto-update slot $SLOT_ID resolved zero packages, which is not allowed." >&2
            exit 1
          fi

          echo "Resolved slot $SLOT_ID -> $package_ids"
          {
            echo "## Auto Update Slot"
            echo
            echo "Slot id: \`$SLOT_ID\`"
            echo "Trigger: \`$TRIGGER_SOURCE\`"
            echo "Package ids: $package_ids"
            echo
            jq -r '.[] | "- `\(.id)` -> `\(.homebrew_path)`"' <<<"$packages_json"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    name: Publish ${{ matrix.package_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Export release bundle
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: ./dagger/tap-pipeline
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: "true"
          call: >-
            -o "$RUNNER_TEMP/bundle"
            release-bundle
            --package-id="${{ matrix.package_id }}"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.package_id }}
          path: ${{ runner.temp }}/bundle

      - name: Publish release asset and update tap file
        id: publish
        env:
          PACKAGE_ID: ${{ matrix.package_id }}
          SLOT_ID: ${{ needs.resolve.outputs.slot_id }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/bundle/release.json"
          release_tag="$(jq -r '.release_tag' "$release_json")"
          homebrew_path="$(jq -r '.homebrew_path' "$release_json")"
          release_title="$(jq -r '.release_title' "$release_json")"
          commit_message="$(jq -r '.commit_message' "$release_json")"
          notes_file="$RUNNER_TEMP/release-notes.txt"
          jq -r '.release_notes' "$release_json" > "$notes_file"

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --title "$release_title" --notes-file "$notes_file"
          fi

          shopt -s nullglob
          artifacts=("$RUNNER_TEMP/bundle/artifacts/"*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts were exported by dagger/tap-pipeline." >&2
            exit 1
          fi

          gh release upload "$release_tag" "${artifacts[@]}" --clobber
          node scripts/apply-release-bundle.mjs --bundle "$RUNNER_TEMP/bundle" --repo "$GITHUB_WORKSPACE"

          if git diff --quiet; then
            echo "status=unchanged" >> "$GITHUB_OUTPUT"
            {
              echo "## ${PACKAGE_ID}"
              echo
              echo "Slot: \`$SLOT_ID\`"
              echo "Result: unchanged"
              echo "Homebrew path: \`$homebrew_path\`"
              echo "Release tag: \`$release_tag\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$homebrew_path"
          git commit -m "$commit_message"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "status=updated" >> "$GITHUB_OUTPUT"
          {
            echo "## ${PACKAGE_ID}"
            echo
            echo "Slot: \`$SLOT_ID\`"
            echo "Result: updated"
            echo "Homebrew path: \`$homebrew_path\`"
            echo "Release tag: \`$release_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
