name: Tap Auto Update

on:
  schedule:
  - cron: "0 6 * * *"
  - cron: "0 7 * * *"
  - cron: "0 8 * * *"
  - cron: "0 9 * * *"
  - cron: "17 0,6,12,18 * * *"
  - cron: "27 0,6,12,18 * * *"
  - cron: "17 2,4,8,10,14,16,20,22 * * *"
  - cron: "41 6 * * *"
    # `t3-code-6h` relies on the separate 06:41 `t3-daily` run plus the times below to keep an effective 6-hour cadence.
  - cron: "41 0,12,18 * * *"
  - cron: "13 10 * * *"
  - cron: "0 10 * * *"
  - cron: "15 10 * * *"
  - cron: "31 10 * * *"
  - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      slot_id:
        description: "Named auto-update slot from dagger/tap-pipeline"
        required: true
        type: choice
        options:
        - rcc-daily
        - action-server-daily
        - desktop-6h
        - devpod-6h
        - vscode-insiders-2h
        - t3-daily
        - t3-code-6h
        - devsy-daily
        - fizzy-daily
        - buzz-daily
        - chatgpt-daily
        - codex-desktop-daily
        - headroom-daily
        - camp-daily
  push:
    branches:
    - main
    paths:
    - config/codex-desktop-linux-features.json
    - codex-desktop-conversion.ref

permissions:
  contents: write

concurrency:
  group: tap-auto-update-${{ github.ref }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: "0.21.9"
  GH_TOKEN: ${{ github.token }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_RETENTION_PER_PACKAGE: "3"

jobs:
  resolve:
    name: Resolve Auto Update Slot
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.slot_id != 'camp-daily') ||
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule != '23 10 * * *')
    runs-on: ubuntu-latest
    outputs:
      slot_id: ${{ steps.slot.outputs.slot_id }}
      trigger_source: ${{ steps.slot.outputs.trigger_source }}
      package_ids_json: ${{ steps.packages.outputs.package_ids_json }}
      has_packages: ${{ steps.packages.outputs.has_packages }}
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Resolve auto-update slot
      id: slot
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
        INPUT_SLOT_ID: ${{ inputs.slot_id }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          slot_id="$INPUT_SLOT_ID"
          trigger_source="workflow_dispatch"
        elif [ "$EVENT_NAME" = "push" ]; then
          slot_id="codex-desktop-daily"
          trigger_source="push:codex-desktop-input"
        else
          case "$EVENT_SCHEDULE" in
            "0 6 * * *") slot_id="rcc-daily" ;;
            "0 7 * * *") slot_id="action-server-daily" ;;
            "0 8 * * *") slot_id="fizzy-daily" ;;
            "0 9 * * *") slot_id="devsy-daily" ;;
            "17 0,6,12,18 * * *") slot_id="desktop-6h" ;;
            "27 0,6,12,18 * * *") slot_id="devpod-6h" ;;
            "17 2,4,8,10,14,16,20,22 * * *") slot_id="vscode-insiders-2h" ;;
            "41 6 * * *") slot_id="t3-daily" ;;
            "41 0,12,18 * * *") slot_id="t3-code-6h" ;;
            "13 10 * * *") slot_id="buzz-daily" ;;
            "0 10 * * *") slot_id="chatgpt-daily" ;;
            "15 10 * * *") slot_id="codex-desktop-daily" ;;
            "31 10 * * *") slot_id="headroom-daily" ;;
            *)
              echo "Unknown scheduled slot for Tap Auto Update: $EVENT_SCHEDULE" >&2
              exit 1
              ;;
          esac
          trigger_source="schedule:$EVENT_SCHEDULE"
        fi

        echo "slot_id=$slot_id" >> "$GITHUB_OUTPUT"
        echo "trigger_source=$trigger_source" >> "$GITHUB_OUTPUT"

    - name: Resolve packages needing update
      id: dagger_plan
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          auto-update-status
          --slot-id="${{ steps.slot.outputs.slot_id }}"
          --github-token=env://GH_TOKEN
          --codex-desktop-conversion-commit="patchraptor-main"

    - name: Build matrix from slot output
      id: packages
      env:
        SLOT_ID: ${{ steps.slot.outputs.slot_id }}
        TRIGGER_SOURCE: ${{ steps.slot.outputs.trigger_source }}
        STATUS_JSON: ${{ steps.dagger_plan.outputs.output }}
      run: |
        set -euo pipefail
        PACKAGE_IDS_JSON="$(jq -cer '[.[] | select(.needs_update) | .id]' <<<"$STATUS_JSON")"
        matrix="$(jq -cn --argjson package_ids "$PACKAGE_IDS_JSON" '{include: ($package_ids | map({package_id: .}))}')"
        count="$(jq '.include | length' <<<"$matrix")"
        package_ids="$(jq -r 'if length == 0 then "none" else join(", ") end' <<<"$PACKAGE_IDS_JSON")"

        echo "Resolved slot $SLOT_ID -> $package_ids"
        {
          echo "## Auto Update Slot"
          echo
          echo "Slot id: \`$SLOT_ID\`"
          echo "Trigger: \`$TRIGGER_SOURCE\`"
          echo "Packages needing build: $package_ids"
          echo
          echo "### Package Status"
          echo
          jq -r '.[] | if .skipped then "- \(.id): current=\(.current_version) upstream=unknown needs_update=false skipped=true reason=\(.skip_reason)" else "- \(.id): current=\(.current_version) upstream=\(.upstream_version) needs_update=\(.needs_update)" end' <<<"$STATUS_JSON"
        } >> "$GITHUB_STEP_SUMMARY"

        {
          echo "package_ids_json=$PACKAGE_IDS_JSON"
          echo "matrix=$matrix"
          echo "has_packages=$([ "$count" -gt 0 ] && echo true || echo false)"
        } >> "$GITHUB_OUTPUT"

  camp:
    name: Sync Camp Formula
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.slot_id == 'camp-daily') ||
      (github.event_name == 'schedule' && github.event.schedule == '23 10 * * *')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Sync formula from the latest verified Camp release
      run: |
        set -euo pipefail
        gh auth setup-git
        git pull --rebase origin "${GITHUB_REF_NAME}"

        sync_dir="$RUNNER_TEMP/camp-sync"
        mkdir -p "$sync_dir"
        gh release download --repo joshyorko/camp --pattern camp.rb --dir "$sync_dir"
        formula="$sync_dir/camp.rb"
        test -f "$formula"

        version="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$formula")"
        test -n "$version"
        grep -Fq "https://github.com/joshyorko/camp/releases/download/v${version}/camp_${version}_linux_amd64.tar.gz" "$formula"
        grep -Fq "https://github.com/joshyorko/camp/releases/download/v${version}/camp_${version}_linux_arm64.tar.gz" "$formula"
        test "$(grep -c '^      sha256 "[0-9a-f]\{64\}"$' "$formula")" -eq 2

        if [ -f Formula/camp.rb ] && cmp -s "$formula" Formula/camp.rb; then
          exit 0
        fi

        install -m 0644 "$formula" Formula/camp.rb
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Formula/camp.rb
        git commit -m "Update camp formula to v${version}"
        git push origin "HEAD:${GITHUB_REF_NAME}"

  build:
    needs: resolve
    if: needs.resolve.outputs.has_packages == 'true'
    name: Build ${{ matrix.package_id }} Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Resolve immutable Buzz Linux source
      if: matrix.package_id == 'buzz-linux'
      id: buzz_source
      run: |
        set -euo pipefail
        release="$(gh api repos/block/buzz/releases/latest)"
        tag="$(jq -er '.tag_name | select(startswith("desktop-v"))' <<<"$release")"
        version="${tag#desktop-v}"
        commit="$(gh api "repos/block/buzz/commits/$tag" --jq '.sha')"
        test "$commit" = "$(jq -er '.target_commitish' <<<"$release")"
        {
          echo "version=$version"
          echo "commit=$commit"
        } >> "$GITHUB_OUTPUT"
    - name: Export release bundle
      if: matrix.package_id != 'buzz-linux'
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          -o "$RUNNER_TEMP/bundle"
          release-bundle
          --package-id="${{ matrix.package_id }}"
          --github-token=env://GH_TOKEN
          --codex-desktop-conversion-commit="patchraptor-main"
          --codex-desktop-package-source="${{ matrix.package_id == 'codex-desktop-linux' && 'latest' || 'pinned' }}"

    - name: Export Buzz Linux release bundle
      if: matrix.package_id == 'buzz-linux'
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/buzz-linux-smoke
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          -o "$RUNNER_TEMP/bundle"
          release-bundle
          --tap=.
          --source-ref="${{ steps.buzz_source.outputs.commit }}"
          --version="${{ steps.buzz_source.outputs.version }}"

    - name: Upload release bundle artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: release-bundle-${{ matrix.package_id }}
        path: ${{ runner.temp }}/bundle

  publish:
    needs:
    - resolve
    - build
    if: needs.resolve.outputs.has_packages == 'true'
    name: Publish Auto Update Slot
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Download release bundles
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: release-bundle-*
        path: ${{ runner.temp }}/bundles

    - name: Publish release assets and update tap files
      env:
        SLOT_ID: ${{ needs.resolve.outputs.slot_id }}
        TRIGGER_SOURCE: ${{ needs.resolve.outputs.trigger_source }}
        PACKAGE_IDS_JSON: ${{ needs.resolve.outputs.package_ids_json }}
      run: |
        set -euo pipefail
        gh auth setup-git
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git pull --rebase origin "${GITHUB_REF_NAME}"

        mapfile -t package_ids < <(jq -r '.[]' <<<"$PACKAGE_IDS_JSON")
        updated_ids=()
        changed_paths=()
        updated_release_jsons=()

        for package_id in "${package_ids[@]}"; do
          bundle_root="$RUNNER_TEMP/bundles/release-bundle-$package_id"
          if [ ! -d "$bundle_root" ]; then
            bundle_root="$RUNNER_TEMP/bundles"
          fi
          bundle_dir="$(node scripts/resolve-release-bundle.mjs --root "$bundle_root")"
          release_json="$bundle_dir/release.json"

          if [ ! -f "$release_json" ]; then
            echo "Missing release metadata for $package_id under $bundle_root" >&2
            exit 1
          fi

          release_tag="$(jq -r '.release_tag' "$release_json")"
          homebrew_path="$(jq -r '.homebrew_path' "$release_json")"
          release_title="$(jq -r '.release_title' "$release_json")"
          notes_file="$RUNNER_TEMP/${package_id}-release-notes.txt"
          jq -r '.release_notes' "$release_json" > "$notes_file"

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --title "$release_title" --notes-file "$notes_file"
          fi

          shopt -s nullglob
          artifacts=("$bundle_dir/artifacts/"*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts were exported for $package_id." >&2
            exit 1
          fi

          gh release upload "$release_tag" "${artifacts[@]}" --clobber
          node scripts/apply-release-bundle.mjs --bundle "$bundle_dir" --repo "$GITHUB_WORKSPACE" >/dev/null
          node scripts/prune-package-releases.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --package-id "$package_id" \
            --current-tag "$release_tag" \
            --keep "$RELEASE_RETENTION_PER_PACKAGE"

          if git diff --quiet -- "$homebrew_path"; then
            result="unchanged"
          else
            result="updated"
            updated_ids+=("$package_id")
            changed_paths+=("$homebrew_path")
            updated_release_jsons+=("$release_json")
          fi

          {
            echo "## ${package_id}"
            echo
            echo "Slot: \`$SLOT_ID\`"
            echo "Trigger: \`$TRIGGER_SOURCE\`"
            echo "Result: $result"
            echo "Homebrew path: \`$homebrew_path\`"
            echo "Release tag: \`$release_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
        done

        if [ "${#changed_paths[@]}" -eq 0 ]; then
          {
            echo "## Publish Summary"
            echo
            echo "Slot: \`$SLOT_ID\`"
            echo "Updated packages: none"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        git add "${changed_paths[@]}"

        if [ "${#updated_ids[@]}" -eq 1 ]; then
          commit_message="$(jq -r '.commit_message' "${updated_release_jsons[0]}")"
        else
          updated_csv="$(printf '%s, ' "${updated_ids[@]}")"
          updated_csv="${updated_csv%, }"
          commit_message="Update ${SLOT_ID}: ${updated_csv}"
        fi

        git commit -m "$commit_message"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"

        {
          echo "## Publish Summary"
          echo
          echo "Slot: \`$SLOT_ID\`"
          echo "Updated packages: $(printf '%s, ' "${updated_ids[@]}" | sed 's/, $//')"
          echo "Commit: \`$commit_message\`"
        } >> "$GITHUB_STEP_SUMMARY"

  no_updates_required:
    needs: resolve
    if: needs.resolve.outputs.has_packages != 'true'
    name: No Auto Updates Required
    runs-on: ubuntu-latest
    steps:
    - run: echo "No upstream package updates detected for this slot."
