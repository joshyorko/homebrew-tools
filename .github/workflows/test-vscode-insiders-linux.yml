name: Test VS Code Insiders Linux

on:
  pull_request:
    paths:
      - ".github/workflows/test-vscode-insiders-linux.yml"
      - ".github/workflows/update-vscode-insiders-linux.yml"
      - "Casks/vscode-insiders-linux.rb"
      - "scripts/package-vscode-insiders-linux.mjs"
      - "dagger/vscode-insiders-linux-smoke/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-vscode-insiders-linux.yml"
      - ".github/workflows/update-vscode-insiders-linux.yml"
      - "Casks/vscode-insiders-linux.rb"
      - "scripts/package-vscode-insiders-linux.mjs"
      - "dagger/vscode-insiders-linux-smoke/**"
  workflow_dispatch:

jobs:
  dagger-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Dagger smoke test
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.20.1"
          verb: call
          module: ./dagger/vscode-insiders-linux-smoke
          args: smoke-test --tap=.
