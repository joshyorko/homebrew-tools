name: Tap CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      t3_source_ref:
        description: "Immutable upstream SHA for T3 acceptance replay only"
        required: true
        type: string
  push:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: tap-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DAGGER_VERSION: "0.21.11"
  GH_TOKEN: ${{ github.token }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tap-pipeline-tests:
    name: Tap Pipeline Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: "26"

    - name: Install Dagger CLI for generated schema regression
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}

    - name: Install planner compiler
      run: npm install --prefix dagger/tap-pipeline --ignore-scripts --package-lock=false

    - name: Run pipeline and regression suites
      run: |
        set -euo pipefail
        python3 scripts/test-dagger-devsy.py
        python3 scripts/test-rcc-maintenance-pin.py
        node scripts/test-t3-dagger-cli.mjs
        node --test scripts/check-t3-source-types.test.mjs
        node --test scripts/t3-source-patches.test.mjs
        node --test scripts/t3-homebrew-desktop-e2e/run-all.test.mjs
        npm test --prefix dagger/tap-pipeline
        node --test scripts/render-review-formula.test.mjs scripts/test-cask-icon-paths.mjs scripts/test-prune-package-releases.mjs scripts/package-vscode-insiders-linux.test.mjs scripts/codex-memoryd-update.test.mjs

  plan:
    name: Resolve Changed Packages
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.plan.outputs.has_packages }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: "26"

    - name: Install planner compiler
      run: npm install --prefix dagger/tap-pipeline --ignore-scripts --package-lock=false

    - name: Build package matrix
      id: plan
      env:
        BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
          plan_json='[]'
        else
          plan_json="$(node scripts/plan-tap-ci.mjs)"
        fi
        matrix="$(jq -c '{include: .}' <<<"$plan_json")"
        count="$(jq '.include | length' <<<"$matrix")"
        package_ids="$(jq -r 'if length == 0 then "none" else map("\(.package_id)[\(.mode)]") | join(", ") end' <<<"$plan_json")"

        echo "Planned package CI: $package_ids"
        {
          echo "## Tap CI Plan"
          echo
          echo "Packages: $package_ids"
          echo
          jq -r 'if length == 0 then "No package-level CI work is required." else .[] | "- \(.package_id): \(.mode) — \(.reason)" end' <<<"$plan_json"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "has_packages=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  t3-paired-acceptance:
    name: T3 paired CLI and Desktop acceptance
    timeout-minutes: 120
    needs:
    - tap-pipeline-tests
    - plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.plan.outputs.has_packages == 'true' &&
      (contains(needs.plan.outputs.matrix, 't3code-cli-main') || contains(needs.plan.outputs.matrix, 't3-code-linux')))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Validate acceptance replay source
      env:
        T3_SOURCE_REF: ${{ inputs.t3_source_ref }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$T3_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
          echo 'T3 acceptance replay requires an immutable 40-character source SHA.' >&2
          exit 1
        fi
    - name: Resolve shared T3 source
      id: t3_source
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        call: resolve-t-3-source --github-token=env://GH_TOKEN --ref="${{ inputs.t3_source_ref }}"
    - name: Record tap and immutable upstream acceptance sources
      env:
        TAP_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        T3_SOURCE_COMMIT: ${{ fromJSON(steps.t3_source.outputs.output).commit }}
      run: |
        mkdir -p "$RUNNER_TEMP/t3-service-attach-evidence"
        printf 'tap_head=%s\ncheckout=%s\nupstream=%s\n' "$TAP_HEAD" "$(git rev-parse HEAD)" "$T3_SOURCE_COMMIT" | tee "$RUNNER_TEMP/t3-service-attach-evidence/source.txt"
    - name: Check selected T3 patches before paired acceptance
      env:
        T3_SOURCE_COMMIT: ${{ fromJSON(steps.t3_source.outputs.output).commit }}
      run: node scripts/check-t3-patches.mjs --source-ref "$T3_SOURCE_COMMIT" --package-ids '["t3code-cli-main","t3-code-linux"]'
    - name: Run T3 CLI acceptance at the resolved source
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          ci-check
          --package-id="t3code-cli-main"
          --github-token=env://GH_TOKEN
          --t-3-source-ref="${{ fromJSON(steps.t3_source.outputs.output).commit }}"
          --t-3-source-version="${{ fromJSON(steps.t3_source.outputs.output).version }}"
    - name: Run T3 Desktop acceptance at the resolved source
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          ci-check
          --package-id="t3-code-linux"
          --github-token=env://GH_TOKEN
          --t-3-source-ref="${{ fromJSON(steps.t3_source.outputs.output).commit }}"
          --t-3-source-version="${{ fromJSON(steps.t3_source.outputs.output).version }}"

    - name: Prepare isolated service attachment evidence
      run: mkdir -p "$RUNNER_TEMP/t3-service-attach-candidate" "$RUNNER_TEMP/t3-service-attach-evidence"
    - name: Export the paired Desktop for GUI acceptance
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        call: >-
          t-3-code-linux-candidate
          --t-3-source-ref="${{ fromJSON(steps.t3_source.outputs.output).commit }}"
          --t-3-source-version="${{ fromJSON(steps.t3_source.outputs.output).version }}"
          export --path="${{ runner.temp }}/t3-service-attach-candidate/candidate.AppImage"
    - name: Exercise packaged service attachment and refusal paths
      run: |
        set -euo pipefail
        docker build -t codex-t3-service-attach:ci scripts/t3-homebrew-desktop-e2e
        export T3_GUI_RUNNER_IMAGE=codex-t3-service-attach:ci
        for scenario in service-attach unknown-owner package-mismatch manual-settings; do
          bash scripts/t3-homebrew-desktop-e2e/run.sh \
            "$RUNNER_TEMP/t3-service-attach-candidate/candidate.AppImage" \
            "$RUNNER_TEMP/t3-service-attach-evidence/$scenario" "$scenario"
        done
    - name: Upload service attachment reports and screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: t3-service-attach-${{ github.sha }}
        path: ${{ runner.temp }}/t3-service-attach-evidence/
        if-no-files-found: ignore
        retention-days: 14
    - name: Remove this job's GUI runner image and candidate
      if: always()
      run: |
        docker image rm codex-t3-service-attach:ci >/dev/null 2>&1 || true
        rm -rf -- "$RUNNER_TEMP/t3-service-attach-candidate"

  ci:
    name: Package CI
    timeout-minutes: 60
    needs:
    - tap-pipeline-tests
    - plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Run package artifact CI through Dagger
      if: matrix.mode == 'artifact'
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          artifact-check
          --package-id="${{ matrix.package_id }}"

    - name: Run package source CI through Dagger
      if: matrix.mode == 'build' && true
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/tap-pipeline
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          ci-check
          --package-id="${{ matrix.package_id }}"
          --github-token=env://GH_TOKEN

    - name: Record local Dagger engine cache stats
      if: always() && !cancelled()
      continue-on-error: true
      run: |
        set -euo pipefail
        {
          echo "### Local Dagger Engine Cache Stats"
          echo
          echo '```json'
        dagger -s query <<'GRAPHQL'
        { engine { localCache { entrySet { entryCount diskSpaceBytes } } } }
        GRAPHQL
          echo '```'
          echo
          echo "These are local engine stats only; they do not prove Dagger Cloud cache or volume reuse."
        } >> "$GITHUB_STEP_SUMMARY"

  no_package_ci_required:
    name: No Package CI Required
    timeout-minutes: 60
    needs:
    - tap-pipeline-tests
    - plan
    if: needs.plan.outputs.has_packages != 'true'
    runs-on: ubuntu-latest
    steps:
    - run: echo "No package-level CI work is required for this change set."
