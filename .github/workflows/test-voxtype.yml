name: Test Voxtype

on:
  pull_request:
    paths:
      - ".github/workflows/test-voxtype.yml"
      - ".github/workflows/update-voxtype.yml"
      - "Formula/voxtype.rb"
      - "scripts/package-voxtype.mjs"
      - "dagger/voxtype-smoke/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-voxtype.yml"
      - ".github/workflows/update-voxtype.yml"
      - "Formula/voxtype.rb"
      - "scripts/package-voxtype.mjs"
      - "dagger/voxtype-smoke/**"
  workflow_dispatch:

jobs:
  dagger-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Dagger smoke test
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.20.1"
          verb: call
          module: ./dagger/voxtype-smoke
          args: smoke-test --tap=.
