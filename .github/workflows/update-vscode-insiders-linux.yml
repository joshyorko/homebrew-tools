name: Update VS Code Insiders Linux Cask

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and replace the current release asset even if the upstream version is unchanged"
        required: false
        default: false
        type: boolean

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Verify tap wiring
        run: |
          set -euo pipefail

          test -f Casks/vscode-insiders-linux.rb
          test -f scripts/package-vscode-insiders-linux.mjs
          test -f dagger/vscode-insiders-linux-smoke/dagger.json

      - name: Resolve upstream Insiders metadata
        id: upstream
        run: |
          set -euo pipefail

          SOURCE_URL="https://update.code.visualstudio.com/latest/linux-x64/insider"
          HEADERS="$(curl -fsSI "$SOURCE_URL")"
          RESOLVED_URL="$(printf '%s\n' "$HEADERS" | awk -F': ' 'tolower($1)=="location" {print $2}' | tr -d '\r')"
          UPSTREAM_SHA256="$(printf '%s\n' "$HEADERS" | awk -F': ' 'tolower($1)=="x-sha256" {print $2}' | tr -d '\r')"

          if [ -z "$RESOLVED_URL" ]; then
            echo "ERROR: failed to resolve VS Code Insiders download URL"
            exit 1
          fi

          curl -fsSL "$RESOLVED_URL" -o "$RUNNER_TEMP/vscode-insiders-source.tar.gz"

          PACKAGE_VERSION="$(tar -xOf "$RUNNER_TEMP/vscode-insiders-source.tar.gz" VSCode-linux-x64/resources/app/package.json | jq -r '.version')"
          BASE_VERSION="${PACKAGE_VERSION%-insider}"
          BUILD_ID="$(printf '%s' "$RESOLVED_URL" | sed -nE 's#^.*/code-insider-x64-([0-9]+)\.tar\.gz$#\1#p')"
          COMMIT_SHA="$(printf '%s' "$RESOLVED_URL" | sed -nE 's#^.*/download/insider/([0-9a-f]+)/.*#\1#p')"
          COMMIT_SHORT="${COMMIT_SHA:0:12}"
          VERSION="${BASE_VERSION},${BUILD_ID},${COMMIT_SHORT}"
          RELEASE_TAG="vscode-insiders-linux-${BASE_VERSION}-${BUILD_ID}-${COMMIT_SHORT}"
          ASSET_NAME="vscode-insiders-linux-${BASE_VERSION}-${BUILD_ID}-${COMMIT_SHORT}.tar.gz"

          if [ -z "$PACKAGE_VERSION" ] || [ "$PACKAGE_VERSION" = "null" ]; then
            echo "ERROR: failed to read package version"
            exit 1
          fi

          if [ -z "$BUILD_ID" ] || [ -z "$COMMIT_SHA" ]; then
            echo "ERROR: failed to parse upstream build metadata from $RESOLVED_URL"
            exit 1
          fi

          echo "resolved_url=$RESOLVED_URL" >> "$GITHUB_OUTPUT"
          echo "upstream_sha256=$UPSTREAM_SHA256" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Read current cask version
        id: current
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -nE 's/^  version "([^"]+)"/\1/p' Casks/vscode-insiders-linux.rb | head -n1)"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check current release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "${{ steps.upstream.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to rebuild
        id: check
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
        run: |
          set -euo pipefail

          NEEDS_UPDATE=false

          if [ "$FORCE_REBUILD" = "true" ]; then
            NEEDS_UPDATE=true
          fi

          if [ "${{ steps.current.outputs.version }}" != "${{ steps.upstream.outputs.version }}" ]; then
            NEEDS_UPDATE=true
          fi

          if [ "${{ steps.release.outputs.exists }}" != "true" ]; then
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Build packaged artifact with Dagger
        if: steps.check.outputs.needs_update == 'true'
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.20.1"
          verb: call
          module: ./dagger/vscode-insiders-linux-smoke
          args: >-
            -o ${{ runner.temp }}/${{ steps.upstream.outputs.asset_name }}
            package-artifact
            --tap=.
            --source-url=${{ steps.upstream.outputs.resolved_url }}
            --version=${{ steps.upstream.outputs.version }}

      - name: Smoke test cask install with Dagger
        if: steps.check.outputs.needs_update == 'true'
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.20.1"
          verb: call
          module: ./dagger/vscode-insiders-linux-smoke
          args: >-
            smoke-test
            --tap=.
            --source-url=${{ steps.upstream.outputs.resolved_url }}
            --version=${{ steps.upstream.outputs.version }}

      - name: Calculate artifact SHA256
        if: steps.check.outputs.needs_update == 'true'
        id: artifact
        env:
          ASSET_NAME: ${{ steps.upstream.outputs.asset_name }}
        run: |
          set -euo pipefail

          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          SHA256="$(sha256sum "$ASSET_PATH" | awk '{print $1}')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.upstream.outputs.release_tag }}/${ASSET_NAME}"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Create or update release asset
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_NAME: ${{ steps.upstream.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
          PACKAGE_VERSION: ${{ steps.upstream.outputs.package_version }}
          RESOLVED_URL: ${{ steps.upstream.outputs.resolved_url }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "VS Code Insiders Linux $VERSION" \
              --notes "Packaged from ${RESOLVED_URL} (${PACKAGE_VERSION})"
          fi

          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$ASSET_NAME" --clobber

      - name: Update cask
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          DOWNLOAD_URL: ${{ steps.artifact.outputs.download_url }}
        run: |
          set -euo pipefail

          perl -0pi -e 's#^  url "[^"]+"#  url "'"$DOWNLOAD_URL"'"#m' Casks/vscode-insiders-linux.rb
          perl -0pi -e 's#^  version "[^"]+"#  version "'"$VERSION"'"#m' Casks/vscode-insiders-linux.rb
          perl -0pi -e 's#^  sha256 x86_64_linux: ".*"#  sha256 x86_64_linux: "'"$SHA256"'"#m' Casks/vscode-insiders-linux.rb

      - name: Commit and push cask update
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks/vscode-insiders-linux.rb; then
            echo "Cask already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vscode-insiders-linux.rb
          git commit -m "Update vscode-insiders-linux cask to ${{ steps.upstream.outputs.version }}"
          git push
