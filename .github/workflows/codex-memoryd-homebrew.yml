name: Codex MemoryD Homebrew Consumer

on:
  pull_request:
    paths:
    - .github/workflows/codex-memoryd-update.yml
    - scripts/codex-memoryd-update.mjs
    - scripts/codex-memoryd-update.test.mjs
    - scripts/verify_codex_memoryd_release.py
    - scripts/test_verify_codex_memoryd_release.py
    - Formula/codex-memoryd.rb
    - scripts/smoke-codex-memoryd-homebrew.sh
    - .github/workflows/codex-memoryd-homebrew.yml
  push:
    branches:
    - main
    paths:
    - .github/workflows/codex-memoryd-update.yml
    - scripts/codex-memoryd-update.mjs
    - scripts/codex-memoryd-update.test.mjs
    - scripts/verify_codex_memoryd_release.py
    - scripts/test_verify_codex_memoryd_release.py
    - Formula/codex-memoryd.rb
    - scripts/smoke-codex-memoryd-homebrew.sh
    - .github/workflows/codex-memoryd-homebrew.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guards:
    name: Signed-release comparison guards
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Exercise synthetic release verification
      run: python3 -B -m unittest discover -s scripts -p test_verify_codex_memoryd_release.py -v

  macos-homebrew:
    name: macOS Homebrew foreground smoke
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install and test the checked-out formula
      run: |
        set -euo pipefail
        brew install --formula ./Formula/codex-memoryd.rb
        brew test ./Formula/codex-memoryd.rb

  wolfi-linuxbrew:
    name: Work-JATT Wolfi Linuxbrew smoke
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joshyorko/room-of-requirement:wolfi@sha256:3c8f3f98b6e2786d9f728e05a54e0cb30e4c83a033ff9f281a5303a461fb3f79
      options: --user root
    steps:
    - name: Checkout formula from PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Exercise immutable Homebrew release consumer path
      env:
        FORMULA_PATH: ${{ github.workspace }}/Formula/codex-memoryd.rb
      run: su -p -s /bin/bash vscode -c 'scripts/smoke-codex-memoryd-homebrew.sh'

