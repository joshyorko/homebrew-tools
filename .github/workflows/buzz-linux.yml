name: Buzz Linux

on:
  schedule:
  - cron: "0 10 * * *"
  workflow_call:
    inputs:
      auto_update:
        description: "Resolve and publish the latest upstream Buzz release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tested artifact and update the cask"
        required: true
        type: boolean
        default: false
      upstream_version:
        description: "Buzz upstream version"
        required: true
        type: string
        default: "0.5.0"
      package_revision:
        description: "Tap package revision"
        required: true
        type: string
        default: "1"
      source_repository:
        description: "Git source repository"
        required: true
        type: string
        default: "https://github.com/block/buzz.git"
      source_ref:
        description: "Exact 40-character source commit"
        required: true
        type: string
        default: "cacebaf5d5fe876b68ec563e68a3b84c60620779"

permissions:
  contents: write

env:
  DAGGER_VERSION: "0.21.8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Resolve Buzz release
      id: release
      env:
        AUTO_UPDATE: ${{ inputs.auto_update || github.event_name == 'schedule' }}
        GH_TOKEN: ${{ github.token }}
        INPUT_PACKAGE_REVISION: ${{ inputs.package_revision }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
      run: |
        set -euo pipefail

        if [ "$AUTO_UPDATE" = "true" ]; then
          latest_release="$(gh api repos/block/buzz/releases/latest)"
          source_tag="$(jq -er '.tag_name' <<<"$latest_release")"
          upstream_version="${source_tag#desktop-v}"
          source_repository="https://github.com/block/buzz.git"
          source_ref="$(gh api "repos/block/buzz/commits/$source_tag" --jq '.sha')"
          package_revision="1"
          publish="true"
          current_version="$(sed -nE 's/^[[:space:]]*version "([^"]+)".*/\1/p' Casks/buzz-linux.rb)"
          current_upstream_version="${current_version%%,*}"

          if [ "$current_upstream_version" = "$upstream_version" ]; then
            needs_update="false"
          else
            needs_update="true"
          fi
        else
          upstream_version="$INPUT_UPSTREAM_VERSION"
          package_revision="$INPUT_PACKAGE_REVISION"
          source_repository="$INPUT_SOURCE_REPOSITORY"
          source_ref="$INPUT_SOURCE_REF"
          publish="$INPUT_PUBLISH"
          needs_update="true"
        fi

        {
          echo "upstream_version=$upstream_version"
          echo "package_revision=$package_revision"
          echo "source_repository=$source_repository"
          echo "source_ref=$source_ref"
          echo "publish=$publish"
          echo "needs_update=$needs_update"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Buzz Linux"
          echo
          echo "Version: \`$upstream_version-$package_revision\`"
          echo "Source: \`$source_ref\`"
          echo "Needs update: \`$needs_update\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Smoke-test portable artifact
      if: steps.release.outputs.needs_update == 'true'
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/buzz-linux-smoke
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        enable-github-summary: "true"
        call: >-
          smoke-test
          --tap=.
          --source-repository="${{ steps.release.outputs.source_repository }}"
          --source-ref="${{ steps.release.outputs.source_ref }}"
          --version="${{ steps.release.outputs.upstream_version }}"
          --revision="${{ steps.release.outputs.package_revision }}"

    - name: Export portable artifact
      if: steps.release.outputs.needs_update == 'true' && steps.release.outputs.publish == 'true'
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77  # v8.4.1
      with:
        version: ${{ env.DAGGER_VERSION }}
        module: ./dagger/buzz-linux-smoke
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        call: >-
          -o "$RUNNER_TEMP/buzz-linux-${{ steps.release.outputs.upstream_version }}-${{ steps.release.outputs.package_revision }}-x86_64.AppImage"
          package-artifact
          --tap=.
          --source-repository="${{ steps.release.outputs.source_repository }}"
          --source-ref="${{ steps.release.outputs.source_ref }}"
          --version="${{ steps.release.outputs.upstream_version }}"
          --revision="${{ steps.release.outputs.package_revision }}"

    - name: Publish release and update cask
      if: steps.release.outputs.needs_update == 'true' && steps.release.outputs.publish == 'true'
      env:
        VERSION: ${{ steps.release.outputs.upstream_version }}
        REVISION: ${{ steps.release.outputs.package_revision }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        asset="$RUNNER_TEMP/buzz-linux-$VERSION-$REVISION-x86_64.AppImage"
        release_tag="buzz-linux-$VERSION-$REVISION"
        checksum="$(sha256sum "$asset" | awk '{print $1}')"

        gh release create "$release_tag" "$asset" \
          --title "Buzz Linux $VERSION-$REVISION" \
          --notes "Portable x86_64 Linux build compiled from the pinned Buzz $VERSION source commit."

        sed -i -E "s/version \".*\"/version \"$VERSION,$REVISION\"/" Casks/buzz-linux.rb
        sed -i -E "s/sha256 x86_64_linux: \".*\"/sha256 x86_64_linux: \"$checksum\"/" Casks/buzz-linux.rb
        sed -i -E "s#url \".*\"#url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/$(basename "$asset")\"#" Casks/buzz-linux.rb

        if git diff --quiet -- Casks/buzz-linux.rb; then
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Casks/buzz-linux.rb
        git commit -m "Update buzz-linux cask to $VERSION-$REVISION"
        git pull --rebase origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
