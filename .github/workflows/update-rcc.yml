name: Update RCC Cask

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest RCC release
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest release from GitHub API (authenticated to avoid rate limits)
          LATEST_RELEASE=$(curl -sH "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/joshyorko/rcc/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed 's/^v//')

          # Validate we got a real version
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Failed to get version from GitHub API"
            echo "$LATEST_RELEASE"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest version: $VERSION"

      - name: Get current cask version
        id: current_version
        run: |
          CURRENT=$(grep -oP 'version "\K[^"]+' Casks/rcc.rb)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Download and calculate SHA256 hashes
        id: get_shas
        run: |
          VERSION="${{ steps.get_release.outputs.version }}"
          BASE_URL="https://github.com/joshyorko/rcc/releases/download/v${VERSION}"

          # Download macOS ARM binary and get SHA256
          echo "Downloading ${BASE_URL}/rcc-macosarm64"
          curl -fSL "${BASE_URL}/rcc-macosarm64" -o /tmp/rcc-macosarm64
          ARM_SHA=$(sha256sum /tmp/rcc-macosarm64 | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> $GITHUB_OUTPUT
          echo "macOS ARM SHA256: $ARM_SHA"

          # Download macOS Intel binary and get SHA256
          echo "Downloading ${BASE_URL}/rcc-macos64"
          curl -fSL "${BASE_URL}/rcc-macos64" -o /tmp/rcc-macos64
          INTEL_SHA=$(sha256sum /tmp/rcc-macos64 | awk '{print $1}')
          echo "intel_sha=$INTEL_SHA" >> $GITHUB_OUTPUT
          echo "macOS Intel SHA256: $INTEL_SHA"

          # Download Linux binary and get SHA256
          echo "Downloading ${BASE_URL}/rcc-linux64"
          curl -fSL "${BASE_URL}/rcc-linux64" -o /tmp/rcc-linux64
          LINUX_SHA=$(sha256sum /tmp/rcc-linux64 | awk '{print $1}')
          echo "linux_sha=$LINUX_SHA" >> $GITHUB_OUTPUT
          echo "Linux SHA256: $LINUX_SHA"

          # Cleanup
          rm -f /tmp/rcc-macosarm64 /tmp/rcc-macos64 /tmp/rcc-linux64

      - name: Get current SHA256 hashes from cask
        id: current_shas
        run: |
          # Extract sha256 values from the nested on_macos/on_arm and on_macos/on_intel blocks
          ARM_SHA=$(grep -A2 'on_arm do' Casks/rcc.rb | grep -oP 'sha256 "\K[a-f0-9]{64}' || echo "")
          INTEL_SHA=$(grep -A2 'on_intel do' Casks/rcc.rb | grep -oP 'sha256 "\K[a-f0-9]{64}' || echo "")
          LINUX_SHA=$(grep -A2 'on_linux do' Casks/rcc.rb | grep -oP 'sha256 "\K[a-f0-9]{64}' || echo "")
          echo "arm_sha=$ARM_SHA" >> $GITHUB_OUTPUT
          echo "intel_sha=$INTEL_SHA" >> $GITHUB_OUTPUT
          echo "linux_sha=$LINUX_SHA" >> $GITHUB_OUTPUT
          echo "Current ARM SHA256: $ARM_SHA"
          echo "Current Intel SHA256: $INTEL_SHA"
          echo "Current Linux SHA256: $LINUX_SHA"

      - name: Check if update needed
        id: check_update
        run: |
          NEEDS_UPDATE=false

          # Check version
          if [ "${{ steps.get_release.outputs.version }}" != "${{ steps.current_version.outputs.version }}" ]; then
            echo "Version changed: ${{ steps.current_version.outputs.version }} -> ${{ steps.get_release.outputs.version }}"
            NEEDS_UPDATE=true
          fi

          # Check ARM SHA256
          if [ "${{ steps.get_shas.outputs.arm_sha }}" != "${{ steps.current_shas.outputs.arm_sha }}" ]; then
            echo "ARM SHA256 changed"
            NEEDS_UPDATE=true
          fi

          # Check Intel SHA256
          if [ "${{ steps.get_shas.outputs.intel_sha }}" != "${{ steps.current_shas.outputs.intel_sha }}" ]; then
            echo "Intel SHA256 changed"
            NEEDS_UPDATE=true
          fi

          # Check Linux SHA256
          if [ "${{ steps.get_shas.outputs.linux_sha }}" != "${{ steps.current_shas.outputs.linux_sha }}" ]; then
            echo "Linux SHA256 changed"
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
          if [ "$NEEDS_UPDATE" = "false" ]; then
            echo "Already up to date"
          fi

      - name: Update cask
        if: steps.check_update.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.get_release.outputs.version }}
          ARM_SHA: ${{ steps.get_shas.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.get_shas.outputs.intel_sha }}
          LINUX_SHA: ${{ steps.get_shas.outputs.linux_sha }}
        run: |
          cat > Casks/rcc.rb << 'EOF'
          cask "rcc" do
            version "VERSION_PLACEHOLDER"

            on_macos do
              on_arm do
                sha256 "ARM_SHA_PLACEHOLDER"
                url "https://github.com/joshyorko/rcc/releases/download/v#{version}/rcc-macosarm64"
                binary "rcc-macosarm64", target: "rcc"
              end

              on_intel do
                sha256 "INTEL_SHA_PLACEHOLDER"
                url "https://github.com/joshyorko/rcc/releases/download/v#{version}/rcc-macos64"
                binary "rcc-macos64", target: "rcc"
              end
            end

            on_linux do
              sha256 "LINUX_SHA_PLACEHOLDER"
              url "https://github.com/joshyorko/rcc/releases/download/v#{version}/rcc-linux64"
              binary "rcc-linux64", target: "rcc"
            end

            name "RCC"
            desc "RCC - Repeatable Contained Code automation runtime"
            homepage "https://github.com/joshyorko/rcc"

            caveats <<~EOS
              If 'rcc' is not found after installation, refresh your shell's cache:
                hash -r

              Or start a new terminal session.
            EOS
          end
          EOF

          # Fix indentation (remove leading spaces from heredoc)
          sed -i 's/^          //' Casks/rcc.rb

          # Replace placeholders with actual values
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" Casks/rcc.rb
          sed -i "s/ARM_SHA_PLACEHOLDER/${ARM_SHA}/" Casks/rcc.rb
          sed -i "s/INTEL_SHA_PLACEHOLDER/${INTEL_SHA}/" Casks/rcc.rb
          sed -i "s/LINUX_SHA_PLACEHOLDER/${LINUX_SHA}/" Casks/rcc.rb

          echo "Updated cask:"
          cat Casks/rcc.rb

      - name: Commit and push changes
        if: steps.check_update.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rcc.rb
          git commit -m "Update rcc cask to v${{ steps.get_release.outputs.version }}"
          git push
